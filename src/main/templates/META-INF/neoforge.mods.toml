modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
authors = "${mod_authors}" #optional
description = '''${mod_description}'''
# Better HP is purely a client-side HUD mod: servers do not need it and clients
# with it can join servers without it.
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "${mod_id}.mixins.json"

# Only loaded when Iron's is installed, so there is no "class not found" warning without it.
[[mixins]]
config = "${mod_id}.irons.mixins.json"
requiredMods = ["irons_spellbooks"]

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# ---- Optional compat. None of these are required; Better HP adapts when they are present. ----

[[dependencies."${mod_id}"]]
modId = "irons_spellbooks"
type = "optional"
reason = "Shows Iron's Spells 'n Spellbooks mana in the Better HP HUD."
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "appleskin"
type = "optional"
reason = "Shows AppleSkin food, saturation, exhaustion and health-restore previews in the Better HP HUD."
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "eidolon_repraised"
type = "optional"
reason = "Frozen health icon when Chilled (e.g. hit by a Wraith) and ethereal health display."
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "legendarysurvivaloverhaul"
type = "optional"
reason = "Shows thirst, body temperature, cold hunger and shield health in the Better HP HUD."
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
