modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
authors = "${mod_authors}" #optional
description = '''${mod_description}'''
# Better HP is purely a client-side HUD mod: servers do not need it and clients
# with it can join servers without it.
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"


[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# ---- Optional compat. None of these are required; Better HP adapts when they are present. ----

[[dependencies."${mod_id}"]]
modId = "appleskin"
type = "optional"
reason = "Shows AppleSkin food, saturation, exhaustion and health-restore previews in the Better HP HUD."
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
