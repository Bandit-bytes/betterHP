modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "better_hp"
version = "${mod_version}"
displayName = "Better HP"
authors = "BanditBytes"
description = '''
A cleaner HUD: health, hunger, armor and more as crisp numbers and icons. Fully customizable.
'''
# Client-side HUD mod: servers don't need it, and clients with it can join servers without it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.better_hp]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.better_hp]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# ---- Optional compat: none of these are required.
[[dependencies.better_hp]]
modId = "irons_spellbooks"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.better_hp]]
modId = "appleskin"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.better_hp]]
modId = "eidolon"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.better_hp]]
modId = "legendarysurvivaloverhaul"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
